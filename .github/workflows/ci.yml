name: Goodly Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint, Build, Vitest & Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck & ESLint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Next.js production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  backend:
    name: Go Backend Vet, Migrations, Unit & Race Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: goodly
          POSTGRES_PASSWORD: goodly_secret
          POSTGRES_DB: goodly_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U goodly -d goodly_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate canonical Supabase migration structure & versions
        run: |
          if [ -d "backend/migrations" ]; then
            echo "ERROR: Duplicate backend/migrations/ directory must not exist; use supabase/migrations/."
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys
          migs = sorted(f for f in os.listdir("supabase/migrations") if f.endswith(".sql"))
          if not migs:
            sys.exit("No migrations found in supabase/migrations/")
          seen = set()
          for m in migs:
            match = re.match(r"^(\d{14})_[a-z0-9_]+\.sql$", m)
            if not match:
              sys.exit(f"Invalid Supabase migration filename: {m}")
            ver = match.group(1)
            if ver in seen:
              sys.exit(f"Duplicate migration version: {ver}")
            seen.add(ver)
            if os.path.getsize(os.path.join("supabase/migrations", m)) == 0:
              sys.exit(f"Empty migration file: {m}")
          print(f"Validated {len(migs)} canonical migrations in supabase/migrations/.")
          PY

      - name: Initialize disposable CI database from canonical Supabase migrations
        env:
          DATABASE_URL: postgres://goodly:goodly_secret@localhost:5432/goodly_db?sslmode=disable
        run: supabase db push --db-url "$DATABASE_URL" --include-all --yes

      - name: Check Go formatting (gofmt)
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet and unit tests (-short)
        working-directory: backend
        run: |
          go vet ./...
          go test -short ./...

      - name: Run full Go integration & race suite
        working-directory: backend
        env:
          DATABASE_URL: postgres://goodly:goodly_secret@localhost:5432/goodly_db?sslmode=disable
          REDIS_ADDR: localhost:6379
          MIGRATIONS_DIR: ../supabase/migrations
          AUTO_MIGRATE: "false"
        run: go test -p 1 -count=1 -race ./...

      - name: Build Go binaries
        working-directory: backend
        run: go build ./cmd/...
